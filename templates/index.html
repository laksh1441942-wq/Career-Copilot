<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if title %}
        CareerCopilot - {{title}}
        {% else %}
        CareerCopilot
        {% endif %}
    </title>
    <link href="{{ url_for('static', path='styles.css') }}" rel="stylesheet">
</head>
<body>
    header>
        <h1>CareerCopilot</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('about') }}">About</a></li>
                <li><a href="{{ url_for('contact') }}">Contact</a></li>
            </ul>
        </nav>
    </header>
    {% block content %}
    {% endblock content %}
    footer>
        <p>&copy; 2024 CareerCopilot. All rights reserved.</p>
    </footer>
</body>
</html>
